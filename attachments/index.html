<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexvon AI</title>
<link href="/static/vendor/fonts.css" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body, #root { height: 100%; overflow: hidden; }
  @supports (height: 100dvh) { #root { height: 100dvh; } }

  /* ── Theme tokens (Night = default, Day = light) ── */
  body {
    --bg: #090b14;
    --bg-elevated: #0d0f1a;
    --surface: #13151f;
    --border: #1e2130;
    --border-soft: #1a1d2e;
    --text: #e8eaf0;
    --text-dim: #9ca3af;
    --text-dimmer: #6b7280;
    --text-faint: #4b5563;
    --text-faintest: #374151;
    --glass-sidebar: rgba(10,12,21,0.82);
    --glass-popup: rgba(13,15,26,0.92);
    --glass-border: rgba(255,255,255,0.06);
    transition: background-color .35s ease, color .35s ease;
  }
  body[data-theme="light"] {
    --bg: #f6f6fb;
    --bg-elevated: #ffffff;
    --surface: #f0f0f6;
    --border: #e3e3ec;
    --border-soft: #eaeaf2;
    --text: #14151f;
    --text-dim: #545a6b;
    --text-dimmer: #6b7280;
    --text-faint: #838aa0;
    --text-faintest: #a3a9ba;
    --glass-sidebar: rgba(255,255,255,0.86);
    --glass-popup: rgba(255,255,255,0.94);
    --glass-border: rgba(20,21,31,0.08);
  }
  body { background: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--text); }
  button, [role="button"] { -webkit-tap-highlight-color: transparent; outline: none; }
  button:focus, div:focus { outline: none; }

  @keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-6px);opacity:1} }
  @keyframes msgSlide { from{opacity:0;transform:translateY(16px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes statusSlide { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
  @keyframes dropIn { from{opacity:0;transform:translateY(-8px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes overlayFade { from{opacity:0} to{opacity:1} }
  @keyframes modalPop { from{opacity:0;transform:translateY(14px) scale(0.94)} to{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes chipPop { from{opacity:0;transform:translateY(10px) scale(0.92)} to{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes starPop { 0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)} }
  @keyframes filePop { from{opacity:0;transform:translateY(8px) scale(0.96)} to{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes iconFlip { from{opacity:0;transform:rotate(-90deg) scale(0.5)} to{opacity:1;transform:rotate(0deg) scale(1)} }

  ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  textarea { outline: none; resize: none; }

  button, [role="button"] {
    transition: transform .18s cubic-bezier(0.34,1.56,0.64,1),
                background .25s cubic-bezier(0.4,0,0.2,1),
                background-color .25s cubic-bezier(0.4,0,0.2,1),
                border-color .25s cubic-bezier(0.4,0,0.2,1),
                color .25s cubic-bezier(0.4,0,0.2,1),
                box-shadow .25s cubic-bezier(0.4,0,0.2,1),
                opacity .2s ease;
  }
  button:active:not(:disabled) { transform: scale(0.93); }
  .nx-sidebar { transition: transform .38s cubic-bezier(0.16,1,0.3,1), box-shadow .3s ease; }
  .nx-convo-item { transition: background .2s cubic-bezier(0.4,0,0.2,1), border-color .2s cubic-bezier(0.4,0,0.2,1), transform .2s cubic-bezier(0.4,0,0.2,1); }
  .nx-convo-item:hover { transform: translateX(3px); }
  .nx-convo-item .nx-delete { transition: opacity .18s ease, color .18s ease, transform .18s ease, background .18s ease; }
  .nx-convo-item:hover .nx-delete { opacity: 1 !important; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/babel.min.js"></script>
<script type="text/babel" src="/static/app.js"></script>
</body>
</html>
